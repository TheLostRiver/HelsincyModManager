[workspace]
members = [
    "src-tauri",
    "src-tauri/crates/hmm-core",
    "src-tauri/crates/hmm-ports",
    "src-tauri/crates/hmm-app",
    "src-tauri/crates/hmm-infra",
    "src-tauri/crates/hmm-games-mhw",
    "src-tauri/crates/hmm-runtime",
    "src-tauri/crates/hmm-cli",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/TheLostRiver/HelsincyModManager"

[workspace.dependencies]
anyhow = "1.0.100"
cap-fs-ext = "4.0.2"
cap-std = "4.0.2"
clap = { version = "4.5", features = ["derive"] }
ctrlc = "3.4"
dirs = "6.0.0"
hmac = "0.12.1"
libc = "0.2.186"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tauri = "2.9.5"
tauri-build = "2.5.3"
tempfile = "3.27.0"
thiserror = "2.0.17"
tracing = "0.1.43"
tracing-subscriber = { version = "0.3.20", default-features = false, features = ["registry"] }
unicode-normalization = "0.1.24"
wait-timeout = "0.2.1"
windows-sys = "0.61.2"
rusqlite = { version = "0.40", features = ["bundled"] }
rusqlite_migration = "2.6"
uuid = { version = "1", features = ["v4"] }
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }
quick-xml = "0.39.4"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "rustls"] }
