[package]
name = "hmm-tauri"
version = "0.1.0-alpha.0"
description = "Tauri shell for Helsincy Mod Manager"
edition.workspace = true
default-run = "hmm-tauri"
license.workspace = true
repository.workspace = true

[lib]
name = "hmm_tauri"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build.workspace = true

[dependencies]
anyhow.workspace = true
hmm-app = { path = "crates/hmm-app" }
hmm-core = { path = "crates/hmm-core" }
hmm-games-mhw = { path = "crates/hmm-games-mhw" }
hmm-infra = { path = "crates/hmm-infra" }
hmm-ports = { path = "crates/hmm-ports" }
hmm-runtime = { path = "crates/hmm-runtime" }
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { workspace = true, features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2.5.4"
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
tempfile = "3.27.0"
zip.workspace = true
