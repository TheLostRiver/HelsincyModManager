[package]
name = "hmm-cli"
version = "0.1.0-alpha.0"
description = "Command-line transport for Helsincy Mod Manager"
edition.workspace = true
license.workspace = true
repository.workspace = true
default-run = "hmm"

[lib]
name = "hmm_cli"

[[bin]]
name = "hmm"
path = "src/main.rs"

[dependencies]
clap.workspace = true
ctrlc.workspace = true
hmm-core = { path = "../hmm-core" }
hmm-runtime = { path = "../hmm-runtime" }
hmm-ports = { path = "../hmm-ports" }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
hmm-app = { path = "../hmm-app" }
hmm-infra = { path = "../hmm-infra" }
rusqlite.workspace = true
serde_json.workspace = true
tempfile.workspace = true
