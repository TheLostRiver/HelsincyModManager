[package]
name = "hmm-infra"
version = "0.1.0-alpha.0"
description = "Infrastructure adapters for Helsincy Mod Manager"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow.workspace = true
cap-fs-ext.workspace = true
cap-std.workspace = true
fs2 = "0.4.3"
hmac.workspace = true
rusqlite.workspace = true
rusqlite_migration.workspace = true
hmm-core = { path = "../hmm-core" }
hmm-ports = { path = "../hmm-ports" }
hmm-unrar-sys = { path = "../hmm-unrar-sys" }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
quick-xml.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10.9"
tempfile = "3.27.0"
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
unicode-normalization.workspace = true
uuid.workspace = true
zip.workspace = true
# 只解压，**不开 compress**——「不做压缩」是设计的非目标，同时少一半代码面。
# 刻意不开 zstd：它是 sevenz-rust2 里唯一会拉进 C 实现（zstd-sys）的编解码器，
# 而 7z 用 zstd 需要非标准的 7-Zip 构建，实际几乎见不到。为一个罕见格式把 C 解析器
# 放回不可信输入路径上，与我们为 unrar 那一整套论证自相矛盾。
# 其余全是纯 Rust：bzip2 走 libbz2-rs-sys（名字带 sys，实现是 Rust）、
# brotli / lz4_flex / ppmd-rust / flate2 亦然。
sevenz-rust2 = { version = "0.22", default-features = false, features = [
    "bzip2",
    "ppmd",
    "deflate",
    "brotli",
    "lz4",
    "aes256",
] }

[target.'cfg(windows)'.dependencies]
wait-timeout.workspace = true
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_TaskScheduler",
    "Win32_System_Threading",
    "Win32_System_Variant",
] }
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_SystemInformation",
] }
winreg = "0.56"

[target.'cfg(not(windows))'.dependencies]
libc.workspace = true

[dev-dependencies]
# 打开语料生成器：rar 的负测语料只能现场合成（.rar 提交不进仓库，
# 且开发机上没有 RAR 压缩器）。理由见 hmm-unrar-sys/src/fixture.rs。
hmm-unrar-sys = { path = "../hmm-unrar-sys", features = ["test-fixtures"] }
# 测试语料：7z 的写入器只在 dev 下开。与 rar 不同，写 7z 没有许可障碍，
# 所以语料可以用同一个 crate 造出来，不必手搓容器格式。
sevenz-rust2 = { version = "0.22", features = ["compress"] }
